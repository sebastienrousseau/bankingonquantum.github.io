<!DOCTYPE html>
<html lang="{{language}}" data-theme-mode="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <!-- Strict CSP permitting same-origin, cloudcdn.pro assets, formspree, and safe fonts/styles -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://formspree.io https://cdn.jsdelivr.net; img-src 'self' data: https: https://cloudcdn.pro; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; form-action 'self' https://formspree.io; base-uri 'none'; object-src 'none';"
    />

    {{!primary}}
    {{!opengraph}}
    {{!twitter}}
    {{!apple}}
    {{!microsoft}}

    <!-- Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{banner}}" />
    <meta property="og:url" content="{{permalink}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{banner}}" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="alternate" hreflang="{{language}}" href="{{permalink}}" />
    <link rel="alternate" hreflang="x-default" href="{{permalink}}" />

    <link rel="alternate" type="application/rss+xml" title="{{name}} — RSS" href="/rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="{{name}} — Atom" href="/atom.xml" />
    <link rel="alternate" type="application/feed+json" title="{{name}} — JSON Feed" href="/feed.json" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="{{logo}}" />
    <link rel="apple-touch-icon" href="https://cloudcdn.pro/cmn/v1/icons/192x192.png" sizes="192x192" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0812" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    {{> header}}

    <main id="main">
      {{#block "main"}}{{/block}}
    </main>

    {{> footer}}

    <!-- Search Modal Dialog -->
    <div id="searchModal" class="search-modal" role="dialog" aria-modal="true" aria-label="Site Search">
      <div class="search-backdrop"></div>
      <div class="search-dialog">
        <div class="search-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="searchInput" class="search-input" placeholder="Search pages, articles, docs..." aria-label="Search query" autocomplete="off">
          <button type="button" class="search-close" id="searchClose" aria-label="Close search">✕</button>
        </div>
        <div id="searchResults" class="search-results" role="listbox">
          <div class="search-empty">Type to search...</div>
        </div>
      </div>
    </div>

    <script src="/main.js" defer></script>
  </body>
</html>
